name: Release

# Publishes the container images a self-hoster runs, so `docker compose up` pulls
# instead of spending ten minutes building Angular and the Python image locally.
#
# Tag a release to publish:  git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to test the workflow without tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Records a signed statement that these bytes came from this workflow and this
      # commit, which is what lets someone verify the image they pulled.
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cv-pal-backend
            context: ./backend
          - image: cv-pal-frontend
            context: ./frontend/cv-pal

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases this, which ghcr.io requires and a forked
          # repository under a mixed-case owner would otherwise fail on.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=CV Pal — keep your CV competitive against AI screening
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. arm64 would need QEMU emulation, under which the Angular
          # install alone runs for the better part of an hour; add it natively if
          # Apple Silicon users ask.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
