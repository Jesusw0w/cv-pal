<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CV Pal">
  <!--
    A CV whose top corners rise into cat ears — one silhouette that reads as a page
    first and a cat second, which is the right order for a product about documents
    with a mascot rather than a mascot with documents.

    Drawn as a single path with fill-rule="evenodd", so the rule lines are holes
    rather than painted shapes. That means the mark is one colour on any background:
    the page beneath shows through the "text", and it works on light, dark, or an
    accent-filled tile with no variants to keep in step.

    `currentColor` rather than a baked hex, so a caller sets the colour with CSS.
    Inline it in a template (not an <img>) for that to apply.
  -->
  <path fill="currentColor" fill-rule="evenodd" d="
    M 8 26.4 L 8 8.2 L 8.35 5.1 Q 8.85 3.5 10.1 4.8 L 13.8 8.2
    Q 16 8.9 18.2 8.2 L 21.9 4.8 Q 23.15 3.5 23.65 5.1 L 24 8.2
    L 24 26.4 Q 24 29 21.4 29 L 10.6 29 Q 8 29 8 26.4 Z
    M 11.2 12.5 h 5.2 a 1.1 1.1 0 0 1 0 2.2 h -5.2 a 1.1 1.1 0 0 1 0 -2.2 Z
    M 11.2 17.1 h 9.6 a 0.85 0.85 0 0 1 0 1.7 h -9.6 a 0.85 0.85 0 0 1 0 -1.7 Z
    M 11.2 20.5 h 9.6 a 0.85 0.85 0 0 1 0 1.7 h -9.6 a 0.85 0.85 0 0 1 0 -1.7 Z
    M 11.2 23.9 h 6.4 a 0.85 0.85 0 0 1 0 1.7 h -6.4 a 0.85 0.85 0 0 1 0 -1.7 Z
  "/>
</svg>
