<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CV Pal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Keep your CV competitive against AI screening, and automate the search around it."
    />

    <!-- SVG first: browsers that support it use it and ignore the rest, so the tab
       icon is sharp at every DPI and follows the light/dark tab strip. The PNG and
       .ico lines stay as the fallback for browsers that don't.

       The SVG is a separate, simplified drawing rather than logo.svg scaled down —
       at 16px the full mark's rule lines fall under a device pixel and smear. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <!-- iOS composites transparency onto black, so this icon has an opaque background. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <!-- Matches --accent in styles.css. It was orange while the app was indigo. -->
    <meta name="theme-color" content="#6366f1" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
