# Serves the built Angular app and proxies the API, so the browser sees one origin.
server {
    # The nginx-unprivileged image cannot bind ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # This app is served over plain HTTP inside the compose network; a reverse proxy in
    # front of it is expected to add HSTS. These are the headers worth setting here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Session tokens live in localStorage rather than HttpOnly cookies — a bearer-token
    # API consumed by an SPA, the trade recorded in PLANNING.md -> Sessions. That makes
    # cross-site scripting the flaw that would actually cost a user their account, and
    # this is the cheapest thing that stands in its way.
    #
    # The bundle is entirely self-contained: no CDN, no external fonts, no analytics.
    # So everything is 'self' and the only relaxation is style-src, which Angular needs
    # because it injects component styles as <style> elements at runtime. Injected CSS
    # is a far weaker primitive than injected script, and it is the one exception.
    #
    # `script-src 'self'` is only possible because angular.json turns off critical-CSS
    # inlining: that feature emits `<link ... onload="this.media='all'">`, an inline
    # event handler, which this directive blocks — and the page would have loaded with
    # no stylesheet at all. Re-enabling inlineCritical means weakening this line.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 12m;  # a little above the API's own 10 MiB upload cap

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The trailing slash on proxy_pass strips the /api prefix, so /api/auth/login
    # reaches the backend as /auth/login.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CV analysis with a local model can take a while.
        proxy_read_timeout 300s;
    }

    # Only the build output is fingerprinted (outputHashing: all covers js and css).
    # Files from public/ keep their names, so caching them as immutable would pin users
    # to an old logo or favicon; they fall through to `location /` instead. index.html
    # must never be cached or users are pinned to a stale build after an upgrade.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # `expires -1` rather than `add_header Cache-Control "no-cache"`.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
